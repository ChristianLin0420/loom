# R0-A — LIBERO, from scratch. THE FIRST SCORE (PLAN 4, PLAN 7).
#
# trains:    E, bank, q_Delta, q_a, D_e, pi_c
# losses:    dyn + act + proposal + balance
# inference: pi_c -> D_e   (no search in R0)
# GPUs:      16 = 2 nodes x 8      time: ~8 h
#
# The 4 h walltime cap means "~8 h" is 2 full links of compute; budget 3 so a
# preempted link does not truncate the run:
#     bash scripts/submit.sh r0a 3
#
# Read the result correctly (PLAN 7): a low score proves something is broken, a
# high score does not prove the method works. Under ~85 -> stop and debug;
# check delta_op first, then the action-rate resampling in the eval harness.

extends: base.yaml

run:
  name: r0a
  # The validated baseline peaks near 25k while a 60k cosine still supplies
  # 2e-4.  Decay through the measured useful region instead of spending the
  # second half of the run destabilising an already-good policy.
  steps: 32000
  log_every: 20
  ckpt_every: 500

data:
  source: libero
  embodiments: [libero_franka]     # registered in contracts.py
  batch_per_gpu: 8
  # The benchmark macro-averages 40 tasks, while flat windows give LIBERO-10
  # 42.8% of training draws and spatial only 17.5%. Sample task first, then a
  # window within it; the loader remains step-indexed and exactly resumable.
  sampling: uniform_task
  action_free: false

optim:
  lr: 3.0e-4
  warmup: 2000
  # Spike rejection: skip the optimizer step when the pre-clip grad norm exceeds
  # this multiple of its running geometric mean. 0 = off (the R0-A2 behaviour).
  #
  # grad_clip alone does NOT protect this run: AdamW's update is invariant to a
  # global rescale of the gradient, so clipping a norm-70000 gradient to 1.0
  # hands the optimizer a unit vector pointing the same way and it takes a full
  # learning-rate step regardless. Measured A/B from the same step-2000 R0-A2
  # weights and the same data order: without the guard the coefficient space
  # collapsed at step 2323 (live_ops 22 -> 5, act/align 0.373 -> 0.500,
  # delta_op 0.064 -> 0.000, peak grad norm 71535); with spike_mult: 10 it did
  # not collapse through step 2700 (act/align 0.369, delta_op 0.069,
  # live_ops 24, peak grad norm 413) at a cost of 11.4% of steps skipped.
  spike_mult: 10.0
  lr_scales:
    # pi_c is a 50M classifier chasing a moving teacher.  The bounded sparse CE
    # below removes the PL support-order spike; the lower head LR removes the
    # remaining timescale mismatch.
    proposal: 0.3

model:
  # These are part of the 26.6%-SR baseline recipe but were missing from this
  # file.  z_prev_residual is architectural behaviour, not a checkpoint tensor,
  # so eval cannot infer it from state_dict.
  estimator:
    learned_z_init: true
    z_prev_residual: false

losses:
  # The hinge knobs live in base.yaml; dyn here only names what R0-A changes.
  dyn:      {enabled: true, weight: 1.0, negatives: within_trajectory}
  # align_to: q_a -- q_Delta regresses onto sg(q_a), not the reverse. The old
  # direction let a 1.415-norm, 100%-common-mode align gradient
  # (2*sqrt(act/align) = 2*sqrt(0.500), the disjoint-support floor) overrun
  # decode's 0.179-norm, 94%-example-dependent one, and q_a went blind:
  # frac_var_a 0.988 at fresh init -> 0.0015 trained. With the flip, c_a's only
  # gradient is D_e's reconstruction of the action -- the one optimum in this
  # objective that a batch-constant c cannot reach.
  act:      {enabled: true, weight: 1.0, align_to: q_a}
  # Match the coefficient that inference actually executes: q_a's detached
  # top-4 simplex weights.  Hard ordered PL labels drove a gradient spike near
  # 26k, while dense KL over q_a's high-entropy 128-op tail made pi_c uniform and
  # cut seeded SR to 8.75%.  Sparse weighted CE keeps the gradient bounded,
  # preserves coefficient magnitudes, and reached 38.25% in the matched gate.
  # Stop its gradient at z so pi_c cannot move its own input.
  proposal:
    enabled: true
    weight: 1.0
    mode: sparse_ce
    temperature: 1.0
    detach_belief: true
  # contracts.BALANCE_COEF, Switch form. See base.yaml.
  balance:  {enabled: true, weight: 1.0e-2}

train_modules: [estimator, bank, q_delta, q_action, decoder, proposal]

slurm:
  nodes: 2
  gpus_per_node: 8
  n_links: 3
