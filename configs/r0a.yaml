# R0-A — LIBERO, from scratch. THE FIRST SCORE (PLAN 4, PLAN 7).
#
# trains:    E, bank, q_Delta, q_a, D_e, pi_c
# losses:    dyn + act + proposal + balance
# inference: pi_c -> D_e   (no search in R0)
# GPUs:      16 = 2 nodes x 8      time: ~8 h
#
# The 4 h walltime cap means "~8 h" is 2 full links of compute; budget 3 so a
# preempted link does not truncate the run:
#     bash scripts/submit.sh r0a 3
#
# Read the result correctly (PLAN 7): a low score proves something is broken, a
# high score does not prove the method works. Under ~85 -> stop and debug;
# check delta_op first, then the action-rate resampling in the eval harness.

extends: base.yaml

run:
  name: r0a
  steps: 60000           # schedule horizon; retune once it/s is measured on 16 GPUs
  log_every: 20
  ckpt_every: 500

data:
  source: libero
  embodiments: [libero_franka]     # registered in contracts.py
  batch_per_gpu: 8
  action_free: false

optim:
  lr: 3.0e-4
  warmup: 2000
  # Spike rejection: skip the optimizer step when the pre-clip grad norm exceeds
  # this multiple of its running geometric mean. 0 = off (the R0-A2 behaviour).
  #
  # grad_clip alone does NOT protect this run: AdamW's update is invariant to a
  # global rescale of the gradient, so clipping a norm-70000 gradient to 1.0
  # hands the optimizer a unit vector pointing the same way and it takes a full
  # learning-rate step regardless. Measured A/B from the same step-2000 R0-A2
  # weights and the same data order: without the guard the coefficient space
  # collapsed at step 2323 (live_ops 22 -> 5, act/align 0.373 -> 0.500,
  # delta_op 0.064 -> 0.000, peak grad norm 71535); with spike_mult: 10 it did
  # not collapse through step 2700 (act/align 0.369, delta_op 0.069,
  # live_ops 24, peak grad norm 413) at a cost of 11.4% of steps skipped.
  spike_mult: 0.0

losses:
  dyn:      {enabled: true, weight: 1.0, negatives: within_trajectory}
  act:      {enabled: true, weight: 1.0}
  proposal: {enabled: true, weight: 1.0}
  balance:  {enabled: true, weight: 3.0e-3}

train_modules: [estimator, bank, q_delta, q_action, decoder, proposal]

slurm:
  nodes: 2
  gpus_per_node: 8
  n_links: 3
