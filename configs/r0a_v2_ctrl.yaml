# R0-A rerun, arm A "ctrl" — the shipped estimator.
#
#   LOOM_RUN_NAME=r0a_v2_ctrl LOOM_CONFIG=configs/r0a_v2_ctrl.yaml \
#     bash scripts/submit.sh r0a 2 --stop_at 7000 --set optim.spike_mult=10
#
# Identical to configs/r0a.yaml apart from `run.name`, which has to differ so the
# two arms are two W&B runs rather than two writers on one id.
#
# `run.steps` STAYS AT 60000. It is the schedule horizon, not the stop point:
# the LR curve at step 7000 must be the one runs/teamb_{ctrl,zinit} saw, or the
# comparison is against a different optimiser trajectory as well as a different
# loss. The link stops with `--stop_at 7000`, which is link-local and excluded
# from `config_hash`.
#
# What differs from runs/teamb_ctrl (the checkpoint this is compared against) is
# exactly the three owner-authorised changes, and none of them lives here:
#   1. D_e(proprio, c) instead of D_e(z, c)      loom/heads/decoder.py
#   2. L_dyn is loom/losses/dyn.py, hinge live   loom/train/loop.py
#   3. Switch balance at BALANCE_COEF = 1e-2     contracts.py, configs/base.yaml

extends: r0a.yaml

run:
  name: r0a_v2_ctrl

model:
  estimator: {}          # the shipped recurrence. Arm B overrides this and only this.
