# Outcome-GRPO v2 reusable-core scaffold.
#
# THIS FILE IS INTENTIONALLY NOT LAUNCHABLE. The component projection found no
# beneficial predeclared GRPO/anchor mixture, the controller has not passed its
# resume smoke, the fixed TRAIN-only trust panel is not frozen, and the current
# validation collection has been exposed to development diagnostics. Nulls are
# freeze placeholders, not implicit zeros or tunable command-line defaults.

extends: r0a_deploy.yaml

run:
  name: r0a_outcome_grpo_v2_pilot_INELIGIBLE
  steps: 80000
  deterministic: true
  log_every: 20
  ckpt_every: 200
  keep_last: 0
  wandb_mode: online

data:
  source: libero
  embodiments: [libero_franka]
  batch_per_gpu: 8
  action_free: false
  sampling: uniform_task
  trajectory_split: train
  holdout_demo_keys: [demo_49]
  recurrent_burn_in: 4

optim:
  lr: 3.0e-4
  warmup: 2000
  min_lr_ratio: 0.05
  grad_clip: 1.0
  betas: [0.9, 0.95]
  weight_decay: 0.05
  eps: 1.0e-8
  lr_scales:
    estimator: 0.0
    bank: 0.0
    q_delta: 0.0
    q_action: 0.0
    ema: 0.0
    decoder: 0.0
    proposal: 0.0125
  reset_state_modules: [proposal]
  update_ema: false

losses:
  dyn:       {enabled: false, weight: 0.0}
  act:       {enabled: false, weight: 0.0}
  potential: {enabled: false, weight: 0.0}
  grpo:
    enabled: true
    weight: 1.0
    group: 8
    clip_eps: 0.2
    reward: terminal_libero_success_only
    baseline_arms: [0, 1, 2, 3, 4, 5, 6, 7]
    ratio_arms: [1, 2, 3, 4, 5, 6, 7]
  # wA: unresolved because every audited alpha in {0,.1,.25,.5,.75,1}
  # retained a harmful mean heldout raw-gradient direction.
  proposal:
    enabled: true
    weight: null
    coefficient_status: PENDING_OBJECTIVE_DIAGNOSIS
    zero_weight_semantics: sparse_anchor_term_disabled_anchor_states_retained_for_demo_reference
    mode: sparse_ce
    temperature: 1.0
    detach_belief: true
  balance:
    enabled: true
    weight: 1.0e-2
    source: proposal
  recovery_reference:
    enabled: true
    kind: sampled_pl_forward_kl_control_variate
    atom: expm1(current_minus_old_logprob)-current_minus_old_logprob
    arms: [1, 2, 3, 4, 5, 6, 7]
    arm0: forbidden
    aggregation: equal_replan_within_arm_then_equal_arm
    controller_weight: outcome_grpo_v2.recovery_kl_controller.beta
  # lambdaD: unresolved. This is categorical KL on exact train-anchor states,
  # not a claim that the scalar equals full top-k Plackett-Luce KL.
  demo_reference:
    enabled: true
    weight: null
    coefficient_status: PENDING_OBJECTIVE_DIAGNOSIS
    kind: frozen_seed_dense_categorical_forward_kl
    states: train_anchor_exact_states_all_horizons
    distribution: base_categorical_identifying_pl_distribution
    seed_requires_grad: false
    seed_in_optimizer: false
    seed_in_checkpoint: false

train_modules: [proposal]

fsdp:
  shard: []
  replicate: [proposal]
  activation_checkpointing: false

outcome_grpo_v2:
  format_version: 2
  trainer_kind: loom_outcome_grpo_v2_proposal_pilot
  method_status: INELIGIBLE_UNFROZEN_PILOT
  seed_checkpoint: runs/r0a_deploy_s1_eval/ckpt_000049666.pt
  seed_global_step: 49666
  seed_config_hash: a199324a6205bb6d
  seed_checkpoint_sha256: 15f286c268caa5327d5aa3abf1f67ebd0555c426a509fef22cb7f537bf6ab4e1
  start_step: 49666
  stop_step: 50466
  snapshot_steps: [49866, 50066, 50266, 50466]
  world_size: 8
  groups_per_train_fold: 200
  minimum_informative_groups_per_fold: 100
  authentication:
    chunk_replans: 32
    proposal_scoring_batch_size: 1
    proposal_scoring_dtype: float32
    proposal_scoring_autocast: false
    cuda_matmul_tf32: false
    cudnn_tf32: false
    float32_matmul_precision: highest
    proposal_scoring_module_mode: eval
    behaviour_logprob_atol: 0.0
