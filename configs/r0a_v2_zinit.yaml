# R0-A rerun, arm B "zinit" — learned z_0, no z_prev residual.
#
#   LOOM_RUN_NAME=r0a_v2_zinit LOOM_CONFIG=configs/r0a_v2_zinit.yaml \
#     bash scripts/submit.sh r0a 2 --stop_at 7000 --set optim.spike_mult=10
#
# The ONLY difference from configs/r0a_v2_ctrl.yaml is the two estimator flags,
# exactly as runs/teamb_zinit differs from runs/teamb_ctrl.
#
# These flags are not parameters, so a checkpoint trained with them loads into a
# DEFAULT estimator with zero missing and zero unexpected keys and eval silently
# scores a different model. `loom.eval.policy._run_model_kwargs` reads them back
# out of this run's `config.json`; the full-protocol job counts the
# `[policy] estimator kwargs from run config:` lines the workers printed, and
# that count is the evidence the right architecture was built.

extends: r0a.yaml

run:
  name: r0a_v2_zinit

model:
  estimator:
    z_prev_residual: false
    learned_z_init: true
